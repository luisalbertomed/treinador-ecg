<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Treinador de ECG</title>
<meta name="description" content="Treinador de eletrocardiograma: fundamentos visuais, interpretação de traçados e simulação de atendimentos.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0e1116">
<link rel="icon" href="favicon.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ECG">
<style>:root{
  --bg:#0e1116; --bg2:#161b23; --bg3:#1d242e; --line:#2a323e;
  --txt:#e6ebf2; --dim:#93a1b3; --dim2:#6c7a8c;
  --acc:#4dd0c4; --acc-d:#0f3b39;
  --ok:#5ad19a; --ok-d:#123528; --err:#f2788a; --err-d:#3a1720;
  --warn:#f0b45f; --warn-d:#3a2a12;
  --r:12px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--txt);
  font:15px/1.6 ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{margin:0;line-height:1.25;font-weight:650}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
a{color:var(--acc)}
/* ---------- anatomia animada (estilo xilogravura) ---------- */
.anatomia-box { background: var(--bg3); border: 1px solid var(--line); border-radius: 10px; padding: 16px; margin-top: 12px; display: flex; flex-direction: column; align-items: center; }
.anatomia-svg { max-width: 180px; width: 100%; height: auto; overflow: visible; }
.xilo-traco { fill: none; stroke: #1a1e24; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; }
.xilo-fundo { fill: #e6e1da; stroke: #1a1e24; stroke-width: 2; transition: fill 0.4s ease; }
.vaso { fill: none; stroke: #93a1b3; stroke-width: 2.5; stroke-linecap: round; transition: stroke 0.4s, stroke-width 0.4s; }
.xilo-fundo.isquemia-ativa { fill: #d95c50; }
.vaso.isquemia-ativa { stroke: #ff2a2a; stroke-width: 4.5; }
.anatomia-legenda { font-size: 13.5px; color: var(--txt); margin-top: 12px; font-weight: 650; text-align: center; }
/* ---------- topo ---------- */
.top{position:sticky;top:0;z-index:20;background:rgba(14,17,22,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{max-width:1180px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;letter-spacing:-.2px}
.brand svg{display:block}
.ver{font-size:11px;font-weight:700;letter-spacing:.4px;color:var(--dim2);background:var(--bg3);padding:2px 7px;border-radius:99px;margin-left:2px}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
.tab{padding:7px 13px;border-radius:99px;color:var(--dim);font-size:14px;font-weight:550;transition:.15s}
.tab:hover{color:var(--txt);background:var(--bg3)}
.tab.on{background:var(--acc);color:#06231f;font-weight:650}
.wrap{max-width:1180px;margin:0 auto;padding:20px 16px 80px}
/* ---------- cartões ---------- */
.card{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:20px;margin-bottom:16px}
.card h3{font-size:16px;margin-bottom:8px}
.muted{color:var(--dim)}
.small{font-size:13.5px}
.tagrow{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 0}
.tag{font-size:11.5px;font-weight:650;letter-spacing:.3px;text-transform:uppercase;padding:3px 8px;border-radius:99px;background:var(--bg3);color:var(--dim)}
.tag.emg{background:var(--err-d);color:var(--err)}
.tag.cat{background:var(--acc-d);color:var(--acc)}
/* ---------- ECG ---------- */
.ecgbox{position:relative;background:#fffdfb;border-radius:10px;overflow:hidden;border:1px solid #e6d5d5;width:fit-content;max-width:100%}
.ecgscroll{position:relative;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch}
.ecgbox canvas{display:block;touch-action:pan-x}
.ecgbox.caliper-on canvas{cursor:crosshair}
.caliper-ovl{display:none;position:absolute;border:1.5px solid #1f7ae0;background:rgba(31,122,224,.13);pointer-events:none;border-radius:2px}
.ecgbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:8px 0 0;font-size:13px}
.btn{padding:6px 12px;border-radius:8px;background:var(--bg3);border:1px solid var(--line);color:var(--txt);font-size:13.5px;font-weight:550;transition:.15s}
.btn:hover{border-color:var(--acc);color:var(--acc)}
.btn.on{background:var(--acc);color:#06231f;border-color:var(--acc)}
.btn.primary{background:var(--acc);color:#06231f;border-color:var(--acc);font-weight:650}
.btn.primary:hover{filter:brightness(1.08);color:#06231f}
.btn.ghost{background:none}
.readout{color:var(--dim);font-size:13px;margin-left:4px;font-variant-numeric:tabular-nums}
/* ---------- biblioteca ---------- */
.lib{display:grid;grid-template-columns:270px minmax(0,1fr);gap:20px;align-items:start}
.lib>*{min-width:0}
.libnav{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:10px;position:sticky;top:70px;max-height:calc(100vh - 92px);overflow:auto}
.libgrp{font-size:11.5px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--dim2);padding:12px 8px 5px}
.libitem{display:block;width:100%;text-align:left;padding:7px 9px;border-radius:8px;font-size:14px;color:var(--dim);line-height:1.35}
.libitem:hover{background:var(--bg3);color:var(--txt)}
.libitem.on{background:var(--acc-d);color:var(--acc);font-weight:600}
.libitem .dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:7px;vertical-align:middle;background:var(--line)}
.libitem .dot.b1{background:var(--err)}.libitem .dot.b2{background:var(--warn)}
.libitem .dot.b3{background:var(--acc)}.libitem .dot.b4{background:var(--ok)}
.libitem .dot.base{background:var(--acc);box-shadow:0 0 0 2px var(--acc-d)}
@media(max-width:820px){.lib{grid-template-columns:minmax(0,1fr)}.libnav{position:static;max-height:none}}
/* ---------- listas de critérios ---------- */
ul.crit{margin:6px 0 0;padding-left:18px}
ul.crit li{margin:6px 0; font-size: 15px;}
.box{border-radius:10px;padding:14px 16px;margin-top:12px;font-size:14.5px;border-left:3px solid}
.box b{font-weight:680; display:block; margin-bottom: 4px;}
.box.peg{background:var(--warn-d);border-color:var(--warn)}
.box.cond{background:var(--acc-d);border-color:var(--acc)}
.box.err{background:var(--err-d);border-color:var(--err)}
.box.ok{background:var(--ok-d);border-color:var(--ok)}
.box .lbl{display:block;font-size:11.5px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;opacity:.85;margin-bottom:6px}
/* ---------- alternativas ---------- */
.opts{display:grid;gap:8px;margin-top:12px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;padding:11px 14px;border-radius:10px;background:var(--bg3);border:1px solid var(--line);transition:.12s;font-size:14.5px;line-height:1.45}
.opt:hover:not(:disabled){border-color:var(--acc)}
.opt:disabled{cursor:default}
.opt .k{flex:0 0 22px;height:22px;border-radius:6px;background:var(--bg2);display:grid;place-items:center;font-size:12.5px;font-weight:700;color:var(--dim)}
.opt.right{background:var(--ok-d);border-color:var(--ok)}
.opt.right .k{background:var(--ok);color:#062217}
.opt.wrong{background:var(--err-d);border-color:var(--err)}
.opt.wrong .k{background:var(--err);color:#2c0810}
/* ---------- laudo ---------- */
.laudo{display:grid;gap:8px;margin-top:12px}
.lrow{display:grid;grid-template-columns:112px 1fr auto;gap:12px;align-items:start;padding:12px 14px;background:var(--bg3);border:1px solid var(--line);border-radius:10px}
.lrow .lk{font-size:12px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--dim2);padding-top:2px}
.lrow .lv{font-size:14.5px; line-height: 1.5;}
.lrow .lv.hidden{color:var(--dim2);font-style:italic}
.lrow .mark{display:flex;gap:5px}
.mark button{width:30px;height:28px;border-radius:7px;background:var(--bg2);border:1px solid var(--line);font-size:14px}
.mark button.on.y{background:var(--ok);border-color:var(--ok);color:#062217}
.mark button.on.n{background:var(--err);border-color:var(--err);color:#2c0810}
@media(max-width:640px){.lrow{grid-template-columns:1fr;gap:4px}}
/* ---------- progresso ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:9px}
.pcell{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:9px 11px}
.pcell .pn{font-size:13.2px;line-height:1.3;margin-bottom:7px}
.bar{height:5px;border-radius:99px;background:var(--bg3);overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);border-radius:99px;transition:.4s}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:14px}
.stat{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:13px 15px}
.stat .n{font-size:26px;font-weight:700;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.stat .l{font-size:12.5px;color:var(--dim);margin-top:1px}
/* --- painel de desempenho por tema (4.1) --- */
.tema-row{display:flex;flex-direction:column;gap:5px;padding:10px 0;border-bottom:1px solid var(--line)}
.tema-row:last-child{border-bottom:none}
.tema-info{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:6px}
.tema-nome{font-size:14px;font-weight:600}
.tema-stat{font-size:12.5px;color:var(--dim);font-variant-numeric:tabular-nums}
.tema-stat.tema-alerta{color:#f87171;font-weight:700}
.tema-stat.tema-ok{color:#4ade80;font-weight:600}
.tema-track{height:6px;border-radius:99px;background:var(--bg3);overflow:hidden}
.tema-bar{height:100%;border-radius:99px;background:var(--acc);transition:width .5s cubic-bezier(.4,0,.2,1)}
.tema-bar.ok{background:#4ade80}
.tema-bar.err{background:#f87171}
textarea{width:100%;min-height:74px;background:var(--bg3);border:1px solid var(--line);border-radius:10px;color:var(--txt);padding:10px;font:12.5px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;resize:vertical}
/* ---------- passos ---------- */
.steps{counter-reset:s;display:grid;gap:9px;margin-top:10px}
.step{counter-increment:s;position:relative;padding:11px 14px 11px 46px;background:var(--bg3);border:1px solid var(--line);border-radius:10px;font-size:14.5px}
.step::before{content:counter(s);position:absolute;left:12px;top:11px;width:23px;height:23px;border-radius:7px;background:var(--acc);color:#06231f;display:grid;place-items:center;font-size:12.5px;font-weight:750}
.step b{display:block;font-size:14.8px;margin-bottom:1px}
.step .d{color:var(--dim);font-size:13.8px}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;background:var(--bg3);font-size:12.5px;color:var(--dim);font-variant-numeric:tabular-nums}
.hr{height:1px;background:var(--line);margin:14px 0}
.center{text-align:center}
.fade{animation:f .25s ease}
@keyframes f{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.scrollhint{position:absolute;right:8px;bottom:6px;background:rgba(22,18,21,.78);color:#fff;font-size:11.5px;
  padding:3px 9px;border-radius:99px;pointer-events:none;display:none;letter-spacing:.2px}
/* ================= FUNDAMENTOS — aulas visuais ================= */
.kicker{font-size:11.5px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;color:var(--acc);margin-bottom:6px}
.ttl{font-size:23px;letter-spacing:-.4px;margin-bottom:4px}
.sub{margin:0;font-size:14.5px}
.txt{margin:0;font-size:15px;line-height:1.65}
.txt+.txt{margin-top:10px}
.dica{margin-top:10px;padding:9px 12px;background:var(--bg3);border-radius:9px;border-left:3px solid var(--acc)}
.navpair{display:flex;gap:8px;flex-wrap:wrap;justify-content:space-between;margin:4px 0 30px}
.sim-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:4px 0 30px}
/* chips de seleção */
.chips{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0 14px}
.chip{--c:#8a93a3;display:flex;align-items:center;gap:7px;padding:8px 13px;border-radius:99px;
  background:var(--bg3);border:1px solid var(--line);font-size:13.5px;font-weight:600;transition:.16s}
.chip i{width:9px;height:9px;border-radius:50%;background:var(--c);flex:0 0 9px;transition:.16s}
.chip .ld{font-size:11.5px;font-weight:500;color:var(--dim2);letter-spacing:.2px}
.chip:hover{border-color:var(--c);color:var(--txt)}
.chip.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 16%,var(--bg3));color:var(--txt)}
.chip.on i{box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 30%,transparent)}
.chip.on .ld{color:var(--txt)}
/* figuras SVG */
.figbox{background:var(--bg3);border:1px solid var(--line);border-radius:11px;padding:14px;display:flex;
  flex-direction:column;align-items:center;justify-content:center}
.figbox svg{width:100%;height:auto;max-width:300px;overflow:visible}
.figcap{font-size:12.5px;color:var(--dim);text-align:center;margin-top:9px;line-height:1.45}
.figpair{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;margin-top:12px}
.figpair.wide{grid-template-columns:280px minmax(0,1fr);align-items:start}
.figpair>*{min-width:0}
@media(max-width:760px){.figpair,.figpair.wide{grid-template-columns:minmax(0,1fr)}}
/* coração batendo */
.cor-bate{animation:bate 1.05s cubic-bezier(.4,0,.5,1) infinite;transform-box:fill-box;transform-origin:center}
.cor-cav{animation:sistole 1.05s cubic-bezier(.4,0,.5,1) infinite;transform-box:fill-box;transform-origin:center}
@keyframes bate{0%,100%{transform:scale(1)}14%{transform:scale(1.045)}34%{transform:scale(.985)}52%{transform:scale(1.012)}}
@keyframes sistole{0%,100%{transform:scale(1)}16%{transform:scale(.74)}42%{transform:scale(.86)}70%{transform:scale(1)}}
.par{stroke:#0f1318;stroke-width:1.4;fill:#39424f;transition:fill .35s ease,filter .35s ease}
.par.on{fill:var(--pc,#e2574c);filter:drop-shadow(0 0 7px var(--pc,#e2574c))}
.par-lbl{font:600 9.5px ui-sans-serif,system-ui,sans-serif;fill:var(--dim2);transition:fill .3s}
.par-lbl.on{fill:#fff}
.art{fill:none;stroke-linecap:round;stroke-linejoin:round;transition:stroke-width .35s,opacity .35s,stroke .35s}
.art.off{opacity:.26;stroke-width:5}
.art.on{opacity:1;stroke-width:8.5;stroke-dasharray:13 9;animation:fluxo .85s linear infinite}
@keyframes fluxo{to{stroke-dashoffset:-22}}
.art-lbl{font:700 10px ui-sans-serif,system-ui,sans-serif;transition:opacity .3s}
.mio{fill:#2b333e;stroke:#0f1318;stroke-width:1.4}
.cav{fill:#151a21}
/* hexaxial */
.hx line{stroke:var(--line);stroke-width:1.5}
.hx .zona{fill:var(--ok);opacity:.13}
.hx .lbl{font:700 11px ui-sans-serif,system-ui,sans-serif;fill:var(--dim)}
.hx .lbl.hot{fill:var(--acc)}
.hx .vet{transition:transform .65s cubic-bezier(.34,1.3,.5,1);transform-box:view-box;transform-origin:0 0}
.hx .vetline{stroke:var(--acc);stroke-width:5;stroke-linecap:round}
.hx .vethead{fill:var(--acc)}
.hx .grau{font:700 12px ui-monospace,monospace;fill:var(--acc)}
/* grade do papel */
.gradebox svg{max-width:360px}
.gp-min{stroke:rgba(214,120,120,.45);stroke-width:.7}
.gp-maj{stroke:rgba(198,86,86,.85);stroke-width:1.5}
.gp-txt{font:600 8px ui-sans-serif,system-ui,sans-serif;fill:#8a4a4a}
.gp-med{stroke:#1f7ae0;stroke-width:2;fill:none}
.gp-medtxt{font:700 9px ui-sans-serif,system-ui,sans-serif;fill:#1f7ae0}
/* tabelas */
.tabwrap{overflow-x:auto;max-width:100%;margin-top:10px;border:1px solid var(--line);border-radius:10px}
table.tab{border-collapse:collapse;width:100%;font-size:13.5px;min-width:520px}
table.tab th{background:var(--bg3);text-align:left;padding:9px 12px;font-size:11.5px;letter-spacing:.5px;
  text-transform:uppercase;color:var(--dim2);font-weight:700;white-space:nowrap}
table.tab td{padding:9px 12px;border-top:1px solid var(--line);vertical-align:top;line-height:1.45}
table.tab tr:hover td{background:var(--bg3)}
/* régua da FC */
.regua{display:flex;gap:0;margin-top:12px;border-radius:9px;overflow:hidden;border:1px solid var(--line)}
.regua div{flex:1;text-align:center;padding:9px 3px;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;
  background:var(--bg3);border-right:1px solid var(--line)}
.regua div:last-child{border-right:0}
.regua div span{display:block;font-size:10.5px;font-weight:500;color:var(--dim2);letter-spacing:.3px}
.regua div.verde{background:var(--ok-d);color:var(--ok)}
/* Treinos com ECG real (Treinar → ECG real, Modo laudo → ECG real): alternativas e retorno com o mesmo visual do treino rápido. */
.row{display:flex;gap:12px;align-items:flex-start}.row.between{justify-content:space-between}.row.wrap{flex-wrap:wrap}
.choices{display:grid;gap:8px;margin-top:12px}
.choices .btn.full{width:100%;margin:0;text-align:left;padding:11px 14px;border-radius:10px;font-size:14.5px;line-height:1.45}
.btn.correct{background:var(--ok-d);border-color:var(--ok)}.btn.wrong{background:var(--err-d);border-color:var(--err)}
.choices .btn.on{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}
.box.bad{background:var(--err-d);border-color:var(--err)}
.mt-8{margin-top:8px}.mt-12{margin-top:12px}.mt-16{margin-top:16px}
.guia-trilha{display:flex;flex-wrap:wrap;gap:6px;list-style:none;padding:0;margin:10px 0;counter-reset:g}
.guia-trilha li{counter-increment:g;font-size:12px;padding:3px 10px;border-radius:99px;background:var(--bg3);color:var(--dim2)}
.guia-trilha li::before{content:counter(g) ". "}
.guia-trilha li.atual{background:var(--acc);color:#06231f;font-weight:700}.guia-trilha li.feita{color:var(--txt)}
.guia-feita{margin-bottom:10px}.guia-etapa textarea{width:100%}
.guia-num{width:120px;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--txt);font-size:16px;margin:6px 0 6px 6px}.guia-num:focus{outline:2px solid var(--acc);outline-offset:1px}
.guia-campo{display:block;margin:6px 0}
.btn-att{white-space:nowrap;display:inline-flex;align-items:center;gap:4px;margin-left:6px;padding:2px 9px;border-radius:99px;font-size:11px;font-weight:650;color:var(--dim2);background:var(--bg3);border:1px solid transparent;vertical-align:middle;cursor:pointer}
.btn-att:hover{color:var(--txt,inherit);border-color:var(--dim2)}
.btn-att .ico{font-size:13px;line-height:1}
.btn-att.ocupado{opacity:.75;cursor:progress}.btn-att.ocupado .ico{display:inline-block;animation:att-gira 1s linear infinite}
.btn-att.ok{color:var(--acc)}.btn-att.erro{color:#e5866b}
.btn-att.nova{background:var(--acc);color:#06231f}
@keyframes att-gira{to{transform:rotate(360deg)}}
@media(max-width:600px){.btn-att:not(.nova):not(.ok):not(.erro) .txt{display:none}.btn-att .v{display:none}.btn-att{padding:3px 8px}}
.aviso-att{position:fixed;left:50%;transform:translateX(-50%) translateY(150%);bottom:calc(14px + env(safe-area-inset-bottom));
  z-index:60;display:flex;align-items:center;gap:12px;max-width:calc(100vw - 24px);
  padding:11px 12px 11px 16px;border-radius:99px;background:var(--bg2);border:1px solid var(--acc);
  box-shadow:0 8px 26px rgba(0,0,0,.45);font-size:13.5px;transition:transform .35s cubic-bezier(.2,1,.3,1)}
.aviso-att.on{transform:translateX(-50%) translateY(0)}
.aviso-att span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.aviso-att button{flex:0 0 auto;padding:5px 12px;border-radius:99px;font-size:13px;font-weight:650}
.aviso-att .att{background:var(--acc);color:#06231f}
.aviso-att .fechar{color:var(--dim2);padding:5px 8px;font-size:16px;line-height:1}
.erro-comum{margin-top:7px;font-size:13px;color:var(--dim);line-height:1.45}
.erro-comum b{color:var(--warn);font-weight:650}
.step .tagrow{margin-top:8px}

.library-search{width:100%;padding:10px;margin:0 0 8px;background:var(--bg2);color:var(--txt);border:1px solid var(--line);border-radius:8px;box-sizing:border-box}
.libitem[hidden]{display:none}.laudo-field{padding:14px 0;border-bottom:1px solid var(--line)}
.laudo-field label{display:block;font-weight:700;margin-bottom:8px}.laudo-field textarea{width:100%;box-sizing:border-box;min-height:65px}.laudo-field .btn{margin-right:8px}.laudo-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--acc);outline-offset:3px}
#save-warning{position:fixed;bottom:8px;left:8px;right:8px;z-index:100}

.pl-logo{width:198px;height:80px;object-fit:contain;border-radius:8px;flex-shrink:0}.brand-title{font-size:14px}.brand{gap:14px}.top-in{flex-wrap:wrap}.tabs{flex-wrap:wrap}
.ecg-guide{margin:12px 0 20px;padding:18px;border:1px solid var(--line);border-radius:12px;background:var(--bg3)}
.guide-controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.guide-controls button,.guide-select{min-height:44px}
.guide-controls .on{background:var(--acc-d);border-color:var(--acc);color:var(--acc)}
.guide-select{padding:8px 12px;background:var(--bg2);color:var(--txt);border:1px solid var(--line);border-radius:8px}
.guide-note{line-height:1.7}.ecg-guide summary{cursor:pointer;min-height:44px;padding-top:8px}
.review-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.review-row p{margin:4px 0}.review-row .btn{flex-shrink:0;min-height:44px}.review-feedback{margin-top:16px}
@media(max-width:600px){.pl-logo{width:140px;height:56px}.brand-title{font-size:12px}.top-in{gap:6px}.tabs{width:100%;gap:3px}.tab{padding:8px 10px;font-size:12px}.review-row{align-items:flex-start;flex-wrap:wrap}.ecg-guide{padding:12px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

.train-controls .on{background:var(--acc-d);border-color:var(--acc);color:var(--acc)}.train-controls .btn{min-height:44px}
.case-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.case-grid h3{margin-top:12px}.case-grid .card{margin-bottom:0}
.case-filters{margin-bottom:16px}.case-panel{border:1px solid var(--line);border-radius:10px;padding:14px;margin-top:18px}.case-panel>summary{font-weight:700;cursor:pointer}.case-history{max-height:340px;overflow:auto;overscroll-behavior:contain;padding-right:8px}.case-observation{padding:10px 0;border-bottom:1px solid var(--line)}.case-observation p{margin:6px 0}.case-record-ecg{margin-top:14px}.case-record-ecg>summary{cursor:pointer}.case-record-ecg .guide-controls{margin:12px 0}.draft-status:empty{display:none}
.heart-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin:16px 0}.heart-grid label{display:flex;flex-direction:column;gap:7px}.heart-grid select{width:100%;min-width:0;white-space:normal}.heart-sum{grid-column:1/-1;font-weight:700}.case-exams{padding:12px;border:1px solid var(--line);border-radius:8px;margin:12px 0}@media(max-width:650px){.heart-grid{grid-template-columns:1fr}}
.case-vitals{padding:14px;margin:14px 0;background:var(--bg3);border-left:3px solid var(--acc);border-radius:8px;font-weight:650}
.case-update{padding:14px;border:1px solid var(--line);border-radius:8px}
.case-scenario{padding:10px 14px;margin:10px 0;border:1px dashed var(--acc);border-radius:8px}
.case-goals{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}.goal{padding:4px 10px;border-radius:999px;font-size:13px;font-weight:650;border:1px solid var(--line)}.goal.ok{background:var(--ok-d);border-color:var(--ok)}.goal.late{background:var(--err-d);border-color:var(--err)}
.opt.check{cursor:pointer}.opt.check input{flex:0 0 18px;width:18px;height:18px;margin-top:2px;accent-color:var(--acc)}.case-result{margin-top:18px;padding-top:18px;border-top:1px solid var(--line)}
.case-sources{margin-top:18px}summary{cursor:pointer;min-height:44px;padding-top:8px}progress{width:100%;height:10px;accent-color:var(--acc)}
@media(max-width:650px){.case-grid{grid-template-columns:1fr}.train-controls .guide-controls{gap:6px}.train-controls .btn{font-size:13px}}
/* Aulas visuais: cor + texto + contorno, sem depender apenas de cor. */
.visual-stage{display:grid;grid-template-columns:minmax(180px,1fr) minmax(0,1.7fr);gap:20px;align-items:center;background:var(--bg);padding:18px;border-radius:12px;margin:18px 0}
.visual-stage svg,.visual-rr svg{display:block;width:100%;height:auto}
.visual-heart{text-align:center}.visual-heart svg{max-width:260px;margin:auto}
.visual-heart text{fill:#f2f6fb;font:14px system-ui;paint-order:stroke;stroke:#142131;stroke-width:3px;stroke-linejoin:round}
.visual-drawing{stroke-dasharray:1;animation:visual-draw 1.2s ease-out both}
@keyframes visual-draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
.visual-trace text{font:15px system-ui}.visual-steps,.visual-controls{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0;align-items:center}
.visual-steps .active{border:2px solid var(--phase);background:var(--bg);color:var(--phase)}
.visual-explain{border-left:4px solid var(--phase);background:var(--bg3);padding:16px;border-radius:8px;min-height:175px}
.visual-explain p{margin:8px 0}.visual-explain strong{color:var(--phase)}
.visual-controls select{font:inherit;background:var(--bg);color:var(--txt);border:1px solid var(--line);padding:8px;border-radius:8px}
.visual-aula button{min-height:44px}.visual-aula button:disabled{opacity:.4;cursor:default}
.visual-aula :focus-visible{outline:3px solid #fff;outline-offset:3px}
.visual-memory{border-top:1px solid var(--line);padding-top:12px}.visual-memory summary{cursor:pointer;padding:8px}
.visual-memory-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-top:12px}
.visual-memory-grid>div{border-top:3px solid;padding:12px;background:var(--bg3);border-radius:6px}.visual-memory-grid p{font-size:13px}
.visual-rr{max-width:640px;margin:auto}.visual-range{display:flex;flex-direction:column;gap:12px}.visual-range input{width:100%;min-height:44px;accent-color:var(--acc)}
.visual-equation{font-size:clamp(18px,3vw,26px);font-weight:650;color:var(--acc)}
@media(max-width:600px){.visual-stage{grid-template-columns:1fr;padding:10px;gap:10px}.visual-heart svg{max-width:180px}.visual-explain{min-height:0}}

.lead-stage{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;margin:18px 0;background:var(--bg);padding:18px;border-radius:12px}
.lead-stage>*{min-width:0}.lead-stage svg{width:100%;height:auto;display:block}.lead-figure svg{max-width:390px;margin:auto}
.lead-stage svg text{fill:#dce6f1;font:14px system-ui}.lead-signal p{font-size:14px;min-height:68px}.lead-side .visual-steps{gap:5px}.lead-side .btn[aria-pressed="true"]{border:2px solid var(--acc);color:var(--acc)}
.tour-playing .lead-impulse{stroke-dasharray:9 8;animation:lead-flow 1s linear infinite}
.tour-playing .lead-wave{stroke-dasharray:1;animation:visual-draw 1.5s ease-out both}
@keyframes lead-flow{to{stroke-dashoffset:-34}}
.territory-stage{display:grid;grid-template-columns:1fr 1fr 1.1fr;gap:12px;align-items:center;margin:20px 0}.territory-stage>*{min-width:0}.territory-stage .figbox{padding:12px}.territory-stage svg{max-width:280px}
.territory-leads{font-size:clamp(18px,2vw,25px);font-weight:700;color:var(--phase)}
.territory-tour .cor-bate,.territory-tour .cor-cav,.territory-tour .art.on{animation-play-state:paused}
.territory-tour.tour-playing .cor-bate,.territory-tour.tour-playing .cor-cav,.territory-tour.tour-playing .art.on{animation-play-state:running}
@media(max-width:700px){.lead-stage{grid-template-columns:1fr;padding:12px}.lead-figure svg{max-width:310px}.territory-stage{grid-template-columns:1fr 1fr}.territory-summary{grid-column:1/-1}.territory-stage .figbox{padding:7px}}
</style>
